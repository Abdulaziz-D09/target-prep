<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <defs>
    <style>
      .line { stroke: black; stroke-width: 1.5; fill: none; }
      .axis { stroke: black; stroke-width: 2; fill: none; }
      .grid { stroke: #ccc; stroke-width: 1; fill: none; }
      .tick { stroke: black; stroke-width: 1.5; fill: none; }
      .text { font-family: serif; font-size: 14px; font-style: italic; }
      .num { font-family: sans-serif; font-size: 12px; }
      .curve { stroke: black; stroke-width: 2.5; fill: none; }
    </style>
  </defs>

  <!-- Grid -->
  <g class="grid">
    <line x1="20" y1="20" x2="280" y2="20" />
    <line x1="20" y1="40" x2="280" y2="40" />
    <line x1="20" y1="60" x2="280" y2="60" />
    <line x1="20" y1="80" x2="280" y2="80" />
    <line x1="20" y1="120" x2="280" y2="120" />
    <line x1="20" y1="140" x2="280" y2="140" />
    <line x1="20" y1="160" x2="280" y2="160" />
    <line x1="20" y1="180" x2="280" y2="180" />
    
    <line x1="40" y1="10" x2="40" y2="190" />
    <line x1="60" y1="10" x2="60" y2="190" />
    <line x1="80" y1="10" x2="80" y2="190" />
    <line x1="100" y1="10" x2="100" y2="190" />
    <line x1="120" y1="10" x2="120" y2="190" />
    <line x1="140" y1="10" x2="140" y2="190" />
    <line x1="180" y1="10" x2="180" y2="190" />
    <line x1="200" y1="10" x2="200" y2="190" />
    <line x1="220" y1="10" x2="220" y2="190" />
    <line x1="240" y1="10" x2="240" y2="190" />
    <line x1="260" y1="10" x2="260" y2="190" />
  </g>

  <!-- Axes -->
  <line class="axis" x1="20" y1="100" x2="285" y2="100" />
  <polygon points="285,96 295,100 285,104" />
  <text class="text" x="290" y="95">x</text>

  <line class="axis" x1="160" y1="190" x2="160" y2="15" />
  <polygon points="156,15 160,5 164,15" />
  <text class="text" x="156" y="10">y</text>

  <!-- Ticks and Numbers -->
  <g class="num" text-anchor="middle" dominant-baseline="central">
    <text x="145" y="105">O</text>
    
    <!-- X axis -->
    <text x="40" y="110">-6</text>
    <text x="80" y="110">-4</text>
    <text x="120" y="110">-2</text>
    <text x="200" y="110">2</text>
    <text x="240" y="110">4</text>
    <text x="280" y="110">6</text>

    <!-- Y axis -->
    <text x="150" y="20">8</text>
    <text x="150" y="40">6</text>
    <text x="150" y="60">4</text>
    <text x="150" y="80">2</text>
    <text x="145" y="120">-2</text>
    <text x="145" y="140">-4</text>
    <text x="145" y="160">-6</text>
    <text x="145" y="180">-8</text>
  </g>

  <!-- Function Curve: roots at -4 (x=80), 0 (x=160), 2 (x=200)
       Using cubic bezier to approximate the shape.
       y = k * (x+4)*x*(x-2). Let's use control points.
       x = -4 (80,100), x = 0 (160,100), x = 2 (200,100)
       Min around x = -2.5 (110, 160), Max around x = 1.1 (182, 82)
  -->
  <path class="curve" d="M 65,10 C 70,50 75,100 80,100 C 95,100 100,165 115,160 C 130,155 140,100 160,100 C 175,100 185,75 200,100 C 210,120 220,190 225,200" />
</svg>
