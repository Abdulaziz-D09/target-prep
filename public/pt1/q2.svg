<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <defs>
    <style>
      .line { stroke: black; stroke-width: 1.5; fill: none; }
      .text { font-family: serif; font-size: 16px; font-style: italic; }
      .deg { font-family: sans-serif; font-size: 16px; }
    </style>
  </defs>
  
  <!-- Line p -->
  <line class="line" x1="50" y1="110" x2="300" y2="110" />
  <text class="text" x="320" y="115">p</text>
  
  <!-- Line r -->
  <line class="line" x1="50" y1="180" x2="300" y2="180" />
  <text class="text" x="320" y="185">r</text>
  
  <!-- Line t -->
  <line class="line" x1="60" y1="50" x2="250" y2="240" />
  <text class="text" x="60" y="40">t</text>
  
  <!-- Angles -->
  <text class="deg" x="160" y="130">72&deg;</text>
  <text class="text" x="90" y="100">x&deg;</text>
</svg>
