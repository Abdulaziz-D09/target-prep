<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 350" width="300" height="350">
  <defs>
    <style>
      .line { stroke: black; stroke-width: 1.5; fill: none; }
      .text { font-family: serif; font-size: 18px; font-style: italic; }
      .deg { font-family: serif; font-size: 16px; font-style: italic; }
      .note { font-family: serif; font-size: 14px; }
    </style>
  </defs>

  <text class="text" x="40" y="40">k</text>
  <line class="line" x1="50" y1="50" x2="250" y2="280" />
  
  <text class="text" x="100" y="30">r</text>
  <line class="line" x1="105" y1="40" x2="105" y2="290" />
  
  <text class="text" x="180" y="30">s</text>
  <line class="line" x1="185" y1="40" x2="185" y2="290" />

  <!-- Intersection r and k is around y = 113.25 -->
  <!-- w and x on the right side of r -->
  <text class="deg" x="113" y="105">w&deg;</text>
  <text class="deg" x="112" y="145">x&deg;</text>
  
  <!-- Intersection s and k is around y = 205.25 -->
  <!-- y and z on the right side of s -->
  <text class="deg" x="192" y="195">y&deg;</text>
  <text class="deg" x="192" y="245">z&deg;</text>
  
  <text class="note" x="70" y="320">Note: Figure not drawn to scale.</text>
</svg>
