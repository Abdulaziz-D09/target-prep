<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="400" height="350">
  <defs>
    <style>
      .axis { stroke: black; stroke-width: 1.5; fill: none; }
      .grid { stroke: #ccc; stroke-width: 1; fill: none; }
      .text { font-family: serif; font-size: 14px; font-style: italic; }
      .num { font-family: sans-serif; font-size: 12px; }
      .point { fill: black; }
      .line { stroke: black; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <g class="grid">
    <line x1="70" y1="50" x2="330" y2="50" />
    <line x1="70" y1="100" x2="330" y2="100" />
    <line x1="70" y1="150" x2="330" y2="150" />
    <line x1="70" y1="200" x2="330" y2="200" />
    <line x1="70" y1="250" x2="330" y2="250" />
    
    <line x1="120" y1="50" x2="120" y2="300" />
    <line x1="170" y1="50" x2="170" y2="300" />
    <line x1="220" y1="50" x2="220" y2="300" />
    <line x1="270" y1="50" x2="270" y2="300" />
    <line x1="320" y1="50" x2="320" y2="300" />
  </g>

  <line class="axis" x1="70" y1="300" x2="340" y2="300" />
  <polygon points="340,296 350,300 340,304" />
  <text class="text" x="345" y="295">x</text>

  <line class="axis" x1="70" y1="300" x2="70" y2="30" />
  <polygon points="66,30 70,20 74,30" />
  <text class="text" x="65" y="20">y</text>

  <g class="num" text-anchor="middle" dominant-baseline="central">
    <text x="60" y="310">O</text>
    
    <!-- X axis -->
    <text x="120" y="315">100</text>
    <text x="170" y="315">200</text>
    <text x="220" y="315">300</text>
    <text x="270" y="315">400</text>
    <text x="320" y="315">500</text>

    <!-- Y axis -->
    <text x="50" y="250">100</text>
    <text x="50" y="200">200</text>
    <text x="50" y="150">300</text>
    <text x="50" y="100">400</text>
    <text x="50" y="50">500</text>
  </g>

  <!-- Points
       x = 100 corresponds to 120, so x px = 70 + (x_val/2)
       y = 100 corresponds to 250, so y px = 300 - (y_val/2)
  -->
  <g class="point">
    <circle cx="95" cy="285" r="4" />
    <circle cx="120" cy="255" r="4" />
    <circle cx="145" cy="260" r="4" />
    <circle cx="170" cy="240" r="4" />
    <circle cx="195" cy="210" r="4" />
    <circle cx="220" cy="225" r="4" />
    <circle cx="245" cy="195" r="4" />
    <circle cx="270" cy="200" r="4" />
    <circle cx="295" cy="145" r="4" />
    <circle cx="320" cy="150" r="4" />
  </g>

  <line class="line" x1="70" y1="300" x2="330" y2="145" />

</svg>
